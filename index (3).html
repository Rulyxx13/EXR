<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartoon AR</title>
<style>
  :root{--bg:#111;--fg:#fff;--accent:#ffb347}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;touch-action:none}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #toy{position:absolute;left:0;top:0;transform-origin:center;user-select:none;-webkit-user-drag:none;max-width:none;cursor:grab}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
       padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.55)}
  button,label.btn{background:var(--accent);color:#222;border:0;border-radius:999px;padding:10px 16px;font:600 14px system-ui;cursor:pointer}
  input[type=file]{display:none}
  #msg{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
       background:rgba(0,0,0,.65);padding:8px 14px;border-radius:12px;font-size:13px;text-align:center;max-width:90%}
</style>
</head>
<body>
<div id="stage"><video id="cam" playsinline muted autoplay></video><img id="toy" alt="cartoon"></div>
<div id="msg">Allow camera access, then drag / pinch the cartoon</div>
<div id="bar">
  <button id="flip">Flip camera</button>
  <label class="btn">Choose image (max 10 MB)<input id="file" type="file" accept="image/*"></label>
  <button id="snap">Take photo</button>
</div>
<script>
const MAX_BYTES = 10 * 1024 * 1024;
const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="600" height="600"><ellipse cx="150" cy="285" rx="80" ry="10" fill="#000" opacity=".15"/><circle cx="70" cy="85" r="32" fill="#ffb347" stroke="#333" stroke-width="6"/><circle cx="230" cy="85" r="32" fill="#ffb347" stroke="#333" stroke-width="6"/><circle cx="70" cy="85" r="16" fill="#ff8fa3"/><circle cx="230" cy="85" r="16" fill="#ff8fa3"/><rect x="95" y="190" width="110" height="85" rx="35" fill="#ffb347" stroke="#333" stroke-width="6"/><circle cx="150" cy="130" r="82" fill="#ffc86b" stroke="#333" stroke-width="6"/><circle cx="120" cy="115" r="17" fill="#fff" stroke="#333" stroke-width="5"/><circle cx="180" cy="115" r="17" fill="#fff" stroke="#333" stroke-width="5"/><circle cx="124" cy="117" r="8" fill="#333"/><circle cx="176" cy="117" r="8" fill="#333"/><circle cx="127" cy="113" r="3" fill="#fff"/><circle cx="179" cy="113" r="3" fill="#fff"/><ellipse cx="150" cy="140" rx="10" ry="7" fill="#333"/><path d="M120 158 Q150 190 180 158 Z" fill="#c0392b" stroke="#333" stroke-width="5" stroke-linejoin="round"/><path d="M135 165 Q150 180 165 165 Z" fill="#ff8fa3"/><circle cx="95" cy="150" r="10" fill="#ff8fa3" opacity=".7"/><circle cx="205" cy="150" r="10" fill="#ff8fa3" opacity=".7"/></svg>`;

const cam = document.getElementById('cam'), toy = document.getElementById('toy'),
      stage = document.getElementById('stage'), msg = document.getElementById('msg');
toy.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

let st = {x: innerWidth/2, y: innerHeight/2, s: 1, w: 300};
function layout(){
  toy.style.width = st.w + 'px';
  toy.style.transform = `translate(${st.x - st.w/2}px, ${st.y - (toy.clientHeight||st.w)/2}px) scale(${st.s})`;
}
toy.onload = () => { st.w = Math.min(300, innerWidth*0.6); layout(); };

// drag + pinch
const ptrs = new Map(); let lastDist = 0;
stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e); lastDist = 0; });
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, e);
  if (ptrs.size === 1){ st.x += e.clientX - prev.clientX; st.y += e.clientY - prev.clientY; }
  else if (ptrs.size === 2){
    const [a,b] = [...ptrs.values()], d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if (lastDist) st.s = Math.min(6, Math.max(.2, st.s * d / lastDist));
    lastDist = d;
  }
  layout();
});
['pointerup','pointercancel'].forEach(t => stage.addEventListener(t, e => { ptrs.delete(e.pointerId); lastDist = 0; }));
stage.addEventListener('wheel', e => { st.s = Math.min(6, Math.max(.2, st.s * (e.deltaY < 0 ? 1.08 : .92))); layout(); }, {passive:true});

// camera
let facing = 'environment', stream;
async function startCam(){
  try{
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:facing}, audio:false});
    cam.srcObject = stream; msg.textContent = 'Drag to move, pinch (or scroll) to resize';
    setTimeout(() => msg.style.display = 'none', 4000);
  }catch(err){ msg.style.display = 'block'; msg.textContent = 'Camera unavailable: open this file over HTTPS/localhost and allow permission. Plain mode still works.'; }
}
document.getElementById('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; startCam(); };
startCam();

// custom image, 10 MB limit
document.getElementById('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > MAX_BYTES){ msg.style.display='block'; msg.textContent = `File is ${(f.size/1048576).toFixed(1)} MB. Maximum is 10 MB.`; e.target.value=''; return; }
  toy.src = URL.createObjectURL(f);
};

// snapshot
document.getElementById('snap').onclick = () => {
  const W = innerWidth, H = innerHeight, c = document.createElement('canvas'), k = devicePixelRatio || 1;
  c.width = W*k; c.height = H*k; const g = c.getContext('2d'); g.scale(k,k);
  if (cam.videoWidth){
    const r = Math.max(W/cam.videoWidth, H/cam.videoHeight), w = cam.videoWidth*r, h = cam.videoHeight*r;
    g.drawImage(cam, (W-w)/2, (H-h)/2, w, h);
  } else { g.fillStyle = '#222'; g.fillRect(0,0,W,H); }
  const ratio = toy.naturalHeight / toy.naturalWidth, w = st.w*st.s, h = w*ratio;
  g.drawImage(toy, st.x - w/2, st.y - h/2, w, h);
  c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'cartoon-ar.png'; a.click(); });
};
addEventListener('resize', layout);
</script>
</body>
</html>
